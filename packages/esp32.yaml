substitutions:
  comment: "ESPHome Svitlo Bot | ESP32"

esphome:
  # Without shadow, http_request must be non-blocking (ESP-IDF, 2026.11+);
  # on older versions a request blocks the main loop for up to the 15 s timeout.
  min_version: "2026.11.0"

wifi:
  enable_btm: true
  enable_rrm: true

interval:
  - interval: ${heartbeat_interval}s
    id: svitlobot
    startup_delay: 5s
    then:
      - script.execute: site_ping

sensor:
  - platform: internal_temperature
    name: Device Temperature
    id: esp_temperature
    entity_category: diagnostic
    icon: mdi:coolant-temperature
    device_class: temperature
    disabled_by_default: true
